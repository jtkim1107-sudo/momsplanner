<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6B5439">
<title>육아플래너</title>

<!-- 홈 화면 웹앱(PWA) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="육아플래너">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="phone">

  <div class="hero">
    <div class="hero-top">
      <span class="app">소행성 · 육아플래너</span>
      <div class="hero-right">
        <button class="star-chip" id="star-chip" onclick="openStarModal()">⭐ 0</button>
        <span class="dday" id="hero-dday"></span>
      </div>
    </div>
    <h1 id="hero-title"></h1>
    <div class="demo-note" id="demo-note">베타 기간이라 판정과 댓글 일부는 샘플이에요</div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="prog-name">이번 구간 준비</span><span id="prog-text"></span></div>
      <div class="progress-bar"><div class="progress-fill" id="prog-fill"></div></div>
    </div>
  </div>

  <div class="prep-tabs" id="prep-tabs"></div>

  <div class="timeline" id="timeline"></div>
  <div class="preview-note" id="preview-note" style="display:none"></div>
  <div class="searchwrap">
    <input id="search" placeholder="젖병, 카시트, 유모차 검색" oninput="doSearch()" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="body-area" id="body-area"></div>

  <!-- 별똥별 지갑 -->
  <div class="modal-veil" id="star-modal">
    <div class="modal">
      <span class="m-label">⭐ 별똥별</span>
      <div id="star-body"></div>
      <button class="m-close2" onclick="closeModal('star-modal')">닫기</button>
    </div>
  </div>

  <!-- 지역혜택 시트 -->
  <div class="modal-veil" id="region-modal">
    <div class="modal">
      <span class="m-label">📍 우리 동네 혜택</span>
      <div class="rg-head"><h2 id="rg-title">우리 지역 혜택 찾기</h2><span class="loc">프로필 주소 기준</span></div>
      <p class="rg-sub">금액·조건은 매년 바뀌어요. 그래서 소행성은 금액 대신 <b>"무엇을, 어디서 확인하는지"</b>를 알려드려요.</p>
      <select id="rg-select" onchange="renderRegionSheet()" style="width:100%;margin-top:12px;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;"></select>
      <div id="rg-body"></div>
      <p class="rg-rule">ⓘ 정확한 금액과 조건은 반드시 공식 확인처에서 확인하세요 · 정보 갱신 요청은 오류제보로</p>
      <button class="m-close2" onclick="closeModal('region-modal')">닫기</button>
    </div>
  </div>

  <!-- 구간 완료 축하 -->
  <div class="modal-veil" id="complete-modal">
    <div class="modal">
      <div class="celebrate">
        <div class="emoji">🎉</div>
        <h3 id="cel-title">구간 준비, 전부 끝!</h3>
        <p id="cel-desc"></p>
        <div class="star-reward">🌟 별똥별 500개 지급</div>
        <p style="font-size:11.5px;margin-top:12px;">구간 완료 보상 — 별똥별마켓에서 사용할 수 있어요</p>
      </div>
      <button class="m-close2" onclick="closeModal('complete-modal')">확인</button>
    </div>
  </div>

  <!-- 내 리스트 리포트 (캡처 공유용) -->
  <div class="report-veil" id="report-veil"><div class="report" id="report-body"></div></div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/data.js"></script>
<script src="js/bigdata.js"></script>
<script src="js/sheet.js"></script>
<script src="js/stars.js"></script>
<script src="js/daycare.js"></script>
<script src="js/babyfood.js"></script>
<script src="js/postpartum.js"></script>
<script src="js/report.js"></script>
<script src="js/app.js"></script>
</body>
</html>
